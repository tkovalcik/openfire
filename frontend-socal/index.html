<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFire SoCal AOI</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <p class="eyebrow">OpenFire</p>
          <h1>SoCal AOI Risk</h1>
          <p class="lede">
            Four-county training AOI with a static inference-shaped risk snapshot.
          </p>
        </div>

        <section class="panel">
          <h2>Snapshot</h2>
          <dl class="metadata-grid">
            <div>
              <dt>Status</dt>
              <dd id="meta-status">Loading...</dd>
            </div>
            <div>
              <dt>Window date</dt>
              <dd id="meta-window-date">Loading...</dd>
            </div>
            <div>
              <dt>Model version</dt>
              <dd id="meta-model-version">Loading...</dd>
            </div>
            <div>
              <dt>Risk features</dt>
              <dd id="meta-feature-count">Loading...</dd>
            </div>
            <div>
              <dt>AOI counties</dt>
              <dd id="meta-county-count">Loading...</dd>
            </div>
          </dl>
        </section>

        <section class="panel">
          <h2>Legend</h2>
          <div id="legend" class="legend"></div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>Time</h2>
            <button id="playback-toggle" class="icon-button" type="button" aria-label="Play timeline">
              Play
            </button>
          </div>
          <div class="timeline-control">
            <div class="timeline-meta">
              <span id="timeline-date">Loading...</span>
              <span id="timeline-position">0 / 0</span>
            </div>
            <input
              id="timeline-slider"
              type="range"
              min="0"
              max="0"
              step="1"
              value="0"
              disabled
              aria-label="Prediction window"
            />
            <div id="timeline-ticks" class="timeline-ticks" aria-hidden="true"></div>
          </div>
        </section>

        <section class="panel">
          <h2>Source</h2>
          <p id="source-message" class="status-message">Loading manifest...</p>
          <p id="status-message" class="status-message">Loading map...</p>
        </section>
      </aside>

      <section class="map-shell">
        <div id="map" aria-label="OpenFire Southern California AOI risk map"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
