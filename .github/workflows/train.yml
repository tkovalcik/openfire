name: train

on:
  workflow_dispatch:
    inputs:
      validation_year:
        description: Year to hold out for validation
        required: false
        default: "2024"
        type: string
      sample_frac:
        description: Downsample fraction (0–1) for quick smoke-test runs. Leave empty for full training.
        required: false
        default: ""
        type: string
      dry_run:
        description: Print plan without loading data or fitting
        required: false
        default: false
        type: boolean
      image_tag:
        description: Optional image tag override. Defaults to the commit SHA.
        required: false
        default: ""
        type: string
      gcp_project_id:
        description: Optional override for the GCP project ID
        required: false
        type: string
      gcp_region:
        description: Optional override for the GCP region
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # Allow at most one training run at a time to avoid conflicting MLflow registrations.
  group: train-${{ github.workflow }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ inputs.gcp_project_id || vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ inputs.gcp_region || vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
  CLOUD_RUN_TRAIN_JOB: ${{ vars.CLOUD_RUN_TRAIN_JOB || 'openfire-train' }}
  CLOUD_RUN_SECRET_MLFLOW_TRACKING_URI: ${{ vars.CLOUD_RUN_SECRET_MLFLOW_TRACKING_URI }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  IMAGE_NAME: openfire-train
  IMAGE_TAG_OVERRIDE: ${{ inputs.image_tag }}

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            GCP_PROJECT_ID
            GCP_REGION
            ARTIFACT_REGISTRY_REPOSITORY
            CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOYER_SERVICE_ACCOUNT
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository variable or workflow input: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push training image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE_TAG_OVERRIDE:-${GITHUB_SHA}}"
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

          docker buildx build \
            --platform linux/amd64 \
            --file docker/Dockerfile.train \
            --tag "${IMAGE_URI}" \
            --push \
            .

      - name: Build training command args
        id: args
        shell: bash
        run: |
          set -euo pipefail

          TRAIN_ARGS=(
            python -m src.pipelines.train
            --output-dir /tmp/openfire/train
            --validation-year "${{ inputs.validation_year }}"
          )

          if [[ -n "${{ inputs.sample_frac }}" ]]; then
            TRAIN_ARGS+=(--sample-frac "${{ inputs.sample_frac }}")
          fi

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            TRAIN_ARGS+=(--dry-run)
          fi

          # gcloud --args expects comma-separated values
          ARGS_CSV="$(IFS=,; echo "${TRAIN_ARGS[*]}")"
          echo "args_csv=${ARGS_CSV}" >> "${GITHUB_OUTPUT}"

      - name: Create or update Cloud Run Job
        shell: bash
        run: |
          set -euo pipefail

          SECRET_FLAGS=()
          if [[ -n "${CLOUD_RUN_SECRET_MLFLOW_TRACKING_URI:-}" ]]; then
            SECRET_FLAGS+=(--update-secrets "MLFLOW_TRACKING_URI=${CLOUD_RUN_SECRET_MLFLOW_TRACKING_URI}:latest")
          fi

          JOB_ARGS=(
            "--image=${IMAGE_URI}"
            "--project=${GCP_PROJECT_ID}"
            "--region=${GCP_REGION}"
            "--service-account=${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}"
            "--memory=16Gi"
            "--cpu=4"
            "--task-timeout=7200s"
            "--max-retries=0"
            "--args=${{ steps.args.outputs.args_csv }}"
          )

          if (( ${#SECRET_FLAGS[@]} > 0 )); then
            JOB_ARGS+=("${SECRET_FLAGS[@]}")
          fi

          if gcloud run jobs describe "${CLOUD_RUN_TRAIN_JOB}" \
               --project="${GCP_PROJECT_ID}" \
               --region="${GCP_REGION}" \
               &>/dev/null; then
            gcloud run jobs update "${CLOUD_RUN_TRAIN_JOB}" "${JOB_ARGS[@]}"
          else
            gcloud run jobs create "${CLOUD_RUN_TRAIN_JOB}" "${JOB_ARGS[@]}"
          fi

      - name: Execute training job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "${CLOUD_RUN_TRAIN_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --wait

      - name: Summarize run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### OpenFire Training"
            echo ""
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- Job: \`${CLOUD_RUN_TRAIN_JOB}\`"
            echo "- Validation year: \`${{ inputs.validation_year }}\`"
            if [[ -n "${{ inputs.sample_frac }}" ]]; then
              echo "- Sample fraction: \`${{ inputs.sample_frac }}\`"
            fi
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "- Mode: **dry run**"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
