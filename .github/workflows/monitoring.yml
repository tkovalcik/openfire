name: Deploy monitoring dashboard

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "src/monitoring/**"
      - "src/pipelines/monitor.py"
      - "docker/Dockerfile.monitoring"
      - "docker/requirements.monitoring.txt"
      - ".github/workflows/monitoring.yml"

env:
  GCP_PROJECT: msds603-mlops-project
  REGION: us-central1
  SERVICE_NAME: openfire-monitoring
  IMAGE: us-central1-docker.pkg.dev/msds603-mlops-project/openfire/monitoring

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -f docker/Dockerfile.monitoring \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --platform managed \
            --service-account openfire-monitoring-runner@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --set-env-vars GCP_PROJECT=${{ env.GCP_PROJECT }} \
            --allow-unauthenticated \
            --quiet

      - name: Print service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --format 'value(status.url)'
